<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison</title>
</head>
<body>
    <h1>Comparison Lesson</h1>
    <script>
        //greater than
        let a='10';
        let b=10;
        console.log(a>b);

        //greather than equal
        console.log(a>=b);

        //less than
        console.log(a<b);
        //less than equal
        console.log(a<=b);

        //double equal
        console.log(a==b);
        //tripal equal
        console.log(a===b);

        // not equal 
        console.log(a!=b);

        //not doubal equal
        console.log(a!==b);
        
        
    </script>
</body>
</html>
