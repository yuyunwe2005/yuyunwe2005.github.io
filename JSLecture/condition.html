<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condition</title>
</head>
<body>
    <h1>Condition Lesson</h1>
    <script>
        //if condition
         let num=prompt("Enter your number");
        //  if(num<100){
        //     document.write("This is number is less than 100");
        //  }

         if(num<100){
            document.write("This is number is less than 100");
         }else if(num==100){
            document.write("This is number is  100");
         }else{
            document.write("This is number is greater than 100");
         }
         
    </script>
</body>
</html>
